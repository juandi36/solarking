item:
  item: netherite_helmet
  display-name: "<gradient:#4b0082:#000000>casco ᴄᴀᴍɪɴᴀɴᴛᴇ ᴅᴇʟ ᴠᴀᴄɪᴏ</gradient>"
  lore:
    - ""
    - "<gradient:#4b0082:#000000>ʙᴏɴᴏ ᴅᴇ ᴄᴏɴᴊᴜɴᴛᴏ: ᴘᴀꜱᴏ ᴅᴇʟ ᴀʙɪꜱᴍᴏ</gradient>"
    - ""
    - "&7ꜰᴏʀᴊᴀᴅᴀ ᴄᴏɴ ʟᴀ ᴇꜱᴇɴᴄɪᴀ ᴅᴇʟ ꜰɪɴ ʏ ᴇʟ ᴇᴛᴇʀ."
    - "&7ᴘᴇʀᴍɪᴛᴇ ᴘᴇɴᴇᴛʀᴀʀ ᴇʟ ᴛᴇᴊɪᴅᴏ ᴅᴇ ʟᴀ ʀᴇᴀʟɪᴅᴀᴅ."
    - ""
    - "&f▸ &dꜱʜɪꜰᴛ x2: &7ᴛᴇʟᴇᴛʀᴀɴꜱᴘᴏʀᴛᴀᴄɪᴏɴ ɪɴꜱᴛᴀɴᴛᴀɴᴇᴀ."
    - "&8ɴᴏ ᴘᴜᴇᴅᴇꜱ ᴄᴀᴢᴀʀ ʟᴏ qᴜᴇ ɴᴏ ᴘᴇʀᴛᴇɴᴇᴄᴇ ᴀqᴜɪ."
  bonuses:
    - id: blink_step
      trigger: equip
      conditions:
        - id: cooldown
          args:
            seconds: 60
      effects:
        - id: TELEPORT_BEHIND @Victim
          args:
            distance: 8
        - id: play_sound
          args:
            sound: entity.enderman.teleport
            volume: 1
            pitch: 1
        - id: spawn_particle
          args:
            particle: portal
            count: 20